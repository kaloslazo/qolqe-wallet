# Pipeline de pruebas por etapas. La web es lo más lento y lo que más se rompe, así que solo corre si lo barato pasó:
#
#   1. verificar, contrato y api (los tres en paralelo): ninguno depende de otro.
#        verificar: los .feature compilan (bddgen falla si falta un paso; pytest recolecta los de Selenium) y la trazabilidad
#                   está completa (cada escenario con su HU, CP y criterio; cada fallo esperado con su DEF).
#        contrato:  gate de Schemathesis: la API cumple su OpenAPI (sin 500, esquema, códigos, auth).
#        api:       los escenarios de negocio en Gherkin (playwright-bdd). Va junto al contrato porque los dos prueban la
#                   misma API desde ángulos distintos: uno con los casos que diseñamos, el otro con entradas generadas.
#   2. web en Chrome y Firefox (en paralelo, Selenium + pytest-bdd): solo si la etapa 1 pasó completa. Selenium prepara sus
#      datos y su sesión por la API del producto: con la API o su contrato rotos, un fallo web no dice nada.
#   3. reportes: portada, trazabilidad con el historial de corridas, cobertura del contrato y diagnóstico por prueba
#      (cada prueba de API que no pasó limpia, con sus requests y la traza del servidor) en GitHub Pages
#
# Quality gate (docs/pruebas.md): verificar, el gate del contrato, api y web deben pasar. Los fallos
# esperados (@fail en Playwright, @defecto en Selenium) son defectos reportados en docs/defectos.md;
# si uno empieza a pasar, el job falla para actualizar el escenario.
name: Pipeline

on:
  push:
    # solo ramas: subir un tag no vuelve a correr todo
    branches: ['**']
    # cambios que no tocan pruebas ni app no corren el pipeline
    paths-ignore: ['docs/**', '**/*.md', 'tests/performance/**']
  pull_request:
    paths-ignore: ['docs/**', '**/*.md', 'tests/performance/**']
  workflow_dispatch:
    inputs:
      evidencia:
        description: 'Evidencia en los reportes: con (captura o traza de cada paso), fallos (solo lo que falla) o sin'
        type: choice
        options: [con, fallos, sin]
        default: con

concurrency:
  group: pipeline-${{ github.ref }}
  # en main cada corrida queda en el historial; en otras ramas y PR basta la última
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  EVIDENCIA: ${{ inputs.evidencia || 'fallos' }}

jobs:
  verificar:
    name: verificar
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements*.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Instalar dependencias
        run: |
          python -m venv .venv && .venv/bin/pip install -r requirements-e2e.txt
          npm ci
      - name: Trazabilidad completa en los .feature
        run: .venv/bin/python .github/scripts/verificar_etiquetas.py
      - name: Pasos de Playwright definidos (bddgen)
        run: npx bddgen
      - name: Escenarios de Selenium recolectados (pytest-bdd)
        run: .venv/bin/python -m pytest tests/e2e --collect-only -q -p no:cacheprovider

  contrato:
    name: contrato
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Instalar dependencias
        run: python -m venv .venv && .venv/bin/pip install -r requirements-pruebas.txt
      - name: Levantar la app
        run: |
          mkdir -p reportes/schemathesis
          .venv/bin/python -m uvicorn qolqe.main:app --port 8000 > reportes/schemathesis/log-contrato.txt 2>&1 &
          for _ in $(seq 1 60); do
            curl -sf http://localhost:8000/api/salud > /dev/null \
              && curl -sf http://localhost:8000/openapi.json -o reportes/schemathesis/openapi.json && exit 0
            sleep 2
          done
          cat reportes/schemathesis/log-contrato.txt; exit 1
      - name: Contrato (Schemathesis)
        run: PATH="$PWD/.venv/bin:$PATH" bash scripts/contrato.sh
      - name: Resumen
        if: ${{ !cancelled() }}
        run: |
          python .github/scripts/resumen.py "Contrato · gate" reportes/schemathesis/gate/junit-*.xml
          python .github/scripts/resumen.py "Contrato · hallazgos conocidos (no bloquean)" reportes/schemathesis/hallazgos/junit-*.xml
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: contrato
          path: reportes/schemathesis/

  api:
    name: api
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements*.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Instalar dependencias
        run: |
          python -m venv .venv && .venv/bin/pip install -r requirements-pruebas.txt
          npm ci
      # la app se levanta aparte para guardar su log: de ahí sale la cobertura frente a Schemathesis
      - name: Levantar la app
        run: |
          mkdir -p reportes
          .venv/bin/python -m uvicorn qolqe.main:app --port 8000 > reportes/log-api.txt 2>&1 &
          for _ in $(seq 1 60); do curl -sf http://localhost:8000/api/salud > /dev/null && exit 0; sleep 2; done
          cat reportes/log-api.txt; exit 1
      - name: Escenarios Gherkin (Playwright + playwright-bdd)
        env:
          QOLQE_URL: http://localhost:8000
        run: npm test
      - name: Resumen
        if: ${{ !cancelled() }}
        run: python .github/scripts/resumen.py "API · Playwright" reportes/resultados-api.json
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: api
          path: |
            playwright-report/
            reportes/junit-api.xml
            reportes/resultados-api.json
            reportes/log-api.txt

  web:
    name: web (${{ matrix.navegador }})
    # la web usa la API para preparar datos y sesión: si la API o su contrato fallan, la web no corre (y el reporte lo dice)
    needs: [verificar, contrato, api]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        navegador: [chrome, firefox]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Instalar dependencias
        run: python -m venv .venv && .venv/bin/pip install -r requirements-e2e.txt
      - name: Escenarios Gherkin de la UI (Selenium + pytest-bdd)
        run: scripts/selenium.sh todo --navegador ${{ matrix.navegador }} --junitxml=reportes/selenium/junit.xml
      - name: Resumen
        if: ${{ !cancelled() }}
        run: python .github/scripts/resumen.py "Web · ${{ matrix.navegador }}" reportes/selenium/junit.xml
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: web-${{ matrix.navegador }}
          path: |
            reportes/selenium/
            !reportes/selenium/*.db*

  reportes:
    name: reportes
    needs: [verificar, contrato, api, web]
    # se publica también cuando algo falla: es justo cuando más hace falta ver el reporte
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      # gestión de casos en Qase: se activa al crear el secreto (docs/gestion-casos.md)
      QASE_TOKEN: ${{ secrets.QASE_TESTOPS_API_TOKEN }}
      QASE_PROYECTO: ${{ vars.QASE_PROYECTO || 'QOLQE' }}
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          path: descargas
      - name: Armar el sitio
        env:
          ESTADO_VERIFICAR: ${{ needs.verificar.result }}
          ESTADO_API: ${{ needs.api.result }}
          ESTADO_CONTRATO: ${{ needs.contrato.result }}
          ESTADO_WEB: ${{ needs.web.result }}
          PAGINAS: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: |
          mkdir -p sitio
          if [ -d descargas/api ]; then
            mkdir -p sitio/api
            cp -R descargas/api/playwright-report/. sitio/api/
            cp descargas/api/reportes/*.xml descargas/api/reportes/*.json descargas/api/reportes/*.txt sitio/api/
          fi
          if [ -d descargas/contrato ]; then cp -R descargas/contrato sitio/contrato; fi
          for d in descargas/web-*; do
            if [ -d "$d" ]; then cp -R "$d" "sitio/$(basename "$d")"; fi
          done
          # historial de corridas anteriores (lo publica este mismo job); en la primera no existe
          curl -sf "$PAGINAS/historial.json" -o sitio/historial.json || echo '[]' > sitio/historial.json
          # diagnóstico: cada prueba que no pasó limpia con los requests que hizo y lo que respondió el servidor
          python .github/scripts/diagnostico.py --playwright sitio/api/resultados-api.json --log-api sitio/api/log-api.txt \
            --salida sitio/diagnostico || echo "sin diagnóstico: faltan los resultados de la API"
          # tablero de calidad: lo de ahora frente a la entrega anterior congelada en calidad/antes.json
          python .github/scripts/tablero.py instantanea --repo . --nombre "Esta corrida (${GITHUB_SHA::7})" --salida /tmp/despues.json \
            --api-json sitio/api/resultados-api.json $([ -f sitio/web-chrome/junit.xml ] && echo "--web-junit sitio/web-chrome/junit.xml") \
            && python .github/scripts/tablero.py tablero --antes calidad/antes.json --despues /tmp/despues.json --salida sitio/tablero/tablero.html \
              --enlace "Diagnóstico por prueba=../diagnostico/diagnostico.html" --enlace "Trazabilidad=../trazabilidad.md" \
            || echo "sin tablero: faltan los resultados"
          python .github/scripts/portada.py sitio
          if [ -f sitio/diagnostico/diagnostico.md ]; then cat sitio/diagnostico/diagnostico.md >> "$GITHUB_STEP_SUMMARY"; fi
          cat sitio/trazabilidad.md >> "$GITHUB_STEP_SUMMARY"
          if [ -f sitio/cobertura-contrato.md ]; then cat sitio/cobertura-contrato.md >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Resultados a Qase (gestión de casos)
        if: ${{ env.QASE_TOKEN != '' }}
        # si Qase no responde, el reporte en Pages se publica igual
        continue-on-error: true
        run: bash .github/scripts/qase.sh sitio
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: sitio
      - id: despliegue
        uses: actions/deploy-pages@v4
